spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

jwt.secret=test-secret-key-for-testing-purposes-only-32chars
jwt.expiration=86400000

cors.allowed-origins=http://localhost:3000

certificate.organization.name=Test Org
certificate.organization.cnpj=00.000.000/0000-00
certificate.organization.city=Test City
certificate.organization.state=TS

admin.name=Admin
admin.email=admin@test.com
admin.password=admin123

url.reset-password=http://localhost:3000/reset-password

resend.api.key=test-api-key